name: CrashCode — Autonomous Exploit & Fix Engine

on:
  pull_request:
    branches:
      - main

jobs:
  audit-and-report:
    runs-on: ubuntu-latest
    permissions:
      pull_requests: write
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install depepdencies
        run: npm ci

      - name: Get Changed Fiels
        id: changed_files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **/*.ts

      - name: Run Code
        if: steps.changed_files.outputs.any_changed == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for file in ${{ steps.changed_files.outputs.all_changed_files }}; do
          if [[ "$file" != *.test.ts ]]; then
              echo "Auditing modified file: $file"
              npx ts-node src/index.ts "$file"
            fi
          done
        continue-on-error: true

      - name: Post PR Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const report_path = './crash-report.md';

            if (fs.existsSync(report_path)) {
              const body = fs.readFileSync(report_path, 'utf8');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
              console.log('Posted CrashCode report to PR.');
            } else {
              console.log('Code is secure. Clean run.');
            }
